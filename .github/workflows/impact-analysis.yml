# Impact Analysis — auto-trigger on push to qa, via a SELF-HOSTED runner.
#
# The runner runs on YOUR machine (where the backend is reachable at
# localhost:8000), so no tunnel / public Cloud Run exposure is needed. It fires
# AFTER the push lands on GitHub, so the backend clones the up-to-date qa tip.
#
# Repo secret required (Settings -> Secrets and variables -> Actions):
#   IMPACT_API_TOKEN = the backend's TRIGGER_API_TOKEN (e.g. local-test-token)
# Optional repo variable:
#   IMPACT_API_URL   = backend base URL (defaults to http://localhost:8000)
#
# Commit/author fields are passed via env (not interpolated into the script) so
# a crafted commit message can't inject commands.

name: Impact Analysis
on:
  push:
    branches: ["qa"]

jobs:
  trigger-impact-analysis:
    runs-on: [self-hosted]
    steps:
      - name: Trigger Impact Analysis pipeline
        shell: pwsh
        env:
          IMPACT_API_URL: ${{ vars.IMPACT_API_URL || 'http://localhost:8000' }}
          IMPACT_API_TOKEN: ${{ secrets.IMPACT_API_TOKEN }}
          REPO_URL: ${{ github.event.repository.clone_url }}
          TARGET: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          MSG: ${{ github.event.head_commit.message }}
          AUTHOR: ${{ github.event.head_commit.author.name }}
          EMAIL: ${{ github.event.head_commit.author.email }}
          TS: ${{ github.event.head_commit.timestamp }}
        run: |
          $body = @{
            repo_url        = $env:REPO_URL
            baseline_branch = 'prod'
            target_branch   = $env:TARGET
            commit_sha      = $env:SHA
            commit_message  = $env:MSG
            author          = $env:AUTHOR
            author_email    = $env:EMAIL
            timestamp       = $env:TS
          } | ConvertTo-Json

          Write-Host "Triggering Impact Analysis: $($env:TARGET) -> prod"
          $resp = Invoke-RestMethod -Uri "$($env:IMPACT_API_URL)/api/v1/pipeline/trigger" `
            -Method POST -ContentType "application/json" `
            -Headers @{ Authorization = "Bearer $($env:IMPACT_API_TOKEN)" } -Body $body
          $resp | ConvertTo-Json
          if (-not $resp.job_id) { throw "Trigger did not return a job_id" }